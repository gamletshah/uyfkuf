<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Умный список задач</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div id="app">
        <h1>Умный список задач</h1>
        <div>
            <input type="text" id="taskInput" placeholder="Введите новую задачу">
            <button id="addTaskBtn">Добавить задачу</button>
        </div>
        <div>
            <button id="toggleNotificationsBtn">Включить уведомления</button>
        </div>
        <div>
            <button id="filterAllBtn">Все</button>
            <button id="filterActiveBtn">Активные</button>
            <button id="filterCompletedBtn">Выполненные</button>
        </div>
        <ul id="taskList"></ul>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                    console.log('ServiceWorker зарегистрирован: ', registration);
                })
                .catch(error => {
                    console.error('Ошибка регистрации ServiceWorker: ', error);
                });
            });
        }
    </script>
</body>
</html>
